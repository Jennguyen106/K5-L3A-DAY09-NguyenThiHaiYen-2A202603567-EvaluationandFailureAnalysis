# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in
# docs/failure_taxonomy.md. A mechanism the taxonomy lacks is a new failure mode.
ticket_over_db: FM-03          # ticket/injection overrides DB facts
stale_policy: FM-06            # stale or not-yet-valid clause
clause_sum: FM-04              # summing clauses instead of applying the rule
double_deduct: FM-05           # prior refund deducted twice
sibling_refund: FM-07          # refunding sibling claims of the same order
denied_ignored: FM-02          # acting on a denied / expired approval
reply_ledger_mismatch: FM-08   # reply states an amount the ledger does not hold
cross_principal: FM-09         # acting on another principal's order
